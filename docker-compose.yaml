name: trendwatch

# Ollama gira nativo sull'host (GPU Metal): i container lo raggiungono via host.docker.internal:11434.
# L'agente (agent/trendwatch.py) e scripts/fake_idp.py girano nativi dalla console (venv mise).

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC (agentgateway, agente)
      - "127.0.0.1:4318:4318"   # OTLP HTTP

  agentgateway:
    build:
      context: .
      dockerfile: agentgateway.Dockerfile
    image: trendwatch/agentgateway:v1.5.0
    pull_policy: never # immagine solo locale: mai cercarla su Docker Hub (se manca viene costruita)
    container_name: agentgateway
    # Config del lab: mise run gw <nome> (es. llm-basic, mcp-single)
    command: ["-f", "configs/${AGW_CONFIG:-llm-basic}.yaml"]
    environment:
      ADMIN_ADDR: 0.0.0.0:15000
      # passati solo se definiti nella shell
      GITHUB_TOKEN:
      GEMINI_API_KEY:
      TRENDS_FIXTURES:
    volumes:
      # stessa working dir dei lab nativi: configs/, mcp-servers/, out/, data.db
      - .:/workshop
    ports:
      - "127.0.0.1:3000:3000"   # MCP  (MCP_URL=http://localhost:3000/mcp)
      - "127.0.0.1:4000:4000"   # LLM  (LLM_BASE_URL=http://localhost:4000/v1)
      - "127.0.0.1:15000:15000" # UI   (http://localhost:15000/ui)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    sysctls:
      # host.docker.internal risolve anche in IPv6, non raggiungibile: il fetch del JWKS
      # (lab mcp-identity) non ripiega su IPv4 e agentgateway esce all'avvio
      net.ipv6.conf.all.disable_ipv6: 1
    depends_on:
      - jaeger
