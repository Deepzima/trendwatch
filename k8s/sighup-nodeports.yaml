# Espone sul Mac (kind extraPortMappings) i componenti installati dalla SIGHUP Distribution:
#   http://localhost:3001  Grafana (Explore -> Tempo per le trace, al posto della UI Jaeger)
#   localhost:4317         OTLP gRPC di Tempo: l'agente sul Mac esporta qui le sue trace, come con Jaeger
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
  ports:
  - {name: http, port: 3000, targetPort: http, nodePort: 30301}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-otlp-nodeport
  namespace: tracing
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: distributor
    app.kubernetes.io/instance: tempo-distributed
    app.kubernetes.io/name: tempo
  ports:
  - {name: grpc-otlp, port: 4317, targetPort: grpc-otlp, nodePort: 30417}
