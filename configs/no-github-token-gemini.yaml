# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite://./data.db
frontendPolicies:
  tracing:
    host: jaeger:4317
    randomSampling: true
  # prompt e completion completi in data.db (pagina Logs della UI)
  accessLog:
    database:
      llm: full
llm:
  models:
  - name: trend-pro
    provider: gemini
    params:
      model: gemini-3.5-flash-lite
      apiKey: "$GEMINI_API_KEY"
mcp:
  # client MCP 2026-07-28 (mcp>=2.0): niente sessione, niente Mcp-Session-Id
  statefulMode: stateless
  targets:
  - name: github
    openapi:
      host: https://api.github.com
      schema:
        file: configs/github-search.openapi.json
