# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite://./data.db
frontendPolicies:
  tracing:
    host: jaeger:4317
    randomSampling: true
llm:
  models:
  - name: trend-pro
    provider: gemini
    params:
      model: gemini-3.5-flash-lite
      apiKey: "$GEMINI_API_KEY"
mcp:
  # client MCP 2026-07-28 (mcp>=2.0): niente sessione, niente Mcp-Session-Id
  statefulMode: stateless
  targets:
  - name: trends
    stdio:
      cmd: python3
      args:
      - ./mcp-servers/trends_server.py
  - name: workspace
    stdio:
      cmd: python3
      args:
      - ./mcp-servers/workspace_server.py
  - name: publish
    stdio:
      cmd: python3
      args:
      - ./mcp-servers/publish_server.py
