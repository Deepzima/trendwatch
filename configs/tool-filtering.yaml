# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite://./data.db
frontendPolicies:
  tracing:
    host: jaeger:4317
    randomSampling: true
  # prompt e completion completi in data.db (pagina Logs della UI)
  accessLog:
    database:
      llm: full
llm:
  models:
  - name: trend-pro
    provider: openAI
    params:
      baseUrl: http://host.docker.internal:11434/v1
      model: qwen3:8b
      apiKey: ollama-does-not-check-this
mcp:
  # client MCP 2026-07-28 (mcp>=2.0): niente sessione, niente Mcp-Session-Id
  statefulMode: stateless
  policies:
    mcpAuthorization:
      rules:
      - mcp.tool.target == "trends"
      - mcp.tool.target == "workspace"
      - mcp.tool.target == "publish" && mcp.tool.name == "get_public_feed"
  targets:
  - name: trends
    stdio:
      cmd: python3
      args:
      - ./mcp-servers/trends_server.py
  - name: workspace
    stdio:
      cmd: python3
      args:
      - ./mcp-servers/workspace_server.py
  - name: publish
    stdio:
      cmd: python3
      args:
      - ./mcp-servers/publish_server.py