# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite://./data.db
frontendPolicies:
  tracing:
    host: jaeger:4317
    randomSampling: true
  # prompt e completion completi in data.db (pagina Logs della UI)
  accessLog:
    database:
      llm: full
llm:
  policies:
    localRateLimit:
    - maxTokens: 5000
      tokensPerFill: 5000
      fillInterval: 300s
      type: tokens
  models:
  - name: trend-pro
    provider: openAI
    params:
      baseUrl: http://host.docker.internal:11434/v1
      model: qwen3:8b
      apiKey: ollama-does-not-check-this