# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite://./data.db
llm:
  models:
  - name: trend-pro
    provider: openAI
    params:
      baseUrl: http://host.docker.internal:11434/v1
      model: qwen3:8b
      apiKey: ollama-does-not-check-this
mcp:
  # client MCP 2026-07-28 (mcp>=2.0): niente sessione, niente Mcp-Session-Id
  statefulMode: stateless
  policies:
    mcpAuthentication:
      mode: optional
      issuer: http://localhost:9000
      audiences:
      - http://localhost:3000/mcp
      jwks:
        url: http://host.docker.internal:9000/.well-known/jwks.json
      resourceMetadata:
        resource: http://localhost:3000/mcp
        scopesSupported:
        - read:all
        bearerMethodsSupported:
        - header
    mcpAuthorization:
      rules:
      - mcp.tool.target == "trends"
      - mcp.tool.target == "publish" && mcp.tool.name == "get_public_feed"
      - mcp.tool.target == "workspace" && has(jwt.sub)
      - mcp.tool.target == "publish" && has(jwt.roles) && "publisher" in jwt.roles
  targets:
  - name: trends
    stdio:
      cmd: python3
      args:
      - ./mcp-servers/trends_server.py
  - name: workspace
    stdio:
      cmd: python3
      args:
      - ./mcp-servers/workspace_server.py
  - name: publish
    stdio:
      cmd: python3
      args:
      - ./mcp-servers/publish_server.py